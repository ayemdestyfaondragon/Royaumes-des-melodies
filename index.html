<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Royaumes des Mélodies — Catalogue Musical Disney (v2)</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --card-hover: #273549;
      --text: #f8fafc;
      --muted: #94a3b8;
      --accent: #38bdf8;
      --accent-2: #a855f7;
      --warn: #fbbf24;
      --border: rgba(148, 163, 184, 0.18);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      background: radial-gradient(circle at top, #172554, var(--bg) 55%);
      color: var(--text);
      min-height: 100vh;
      padding: 2rem 1rem 4rem;
    }
    .container {
      max-width: 1000px;
      margin: 0 auto;
    }
    header {
      text-align: center;
      margin-bottom: 2rem;
    }
    h1 {
      margin: 0 0 0.5rem;
      font-size: clamp(1.75rem, 4vw, 2.5rem);
      background: linear-gradient(90deg, var(--accent), var(--accent-2));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .subtitle {
      color: var(--muted);
      margin: 0;
    }
    .controls {
      display: grid;
      grid-template-columns: 1fr auto auto;
      gap: 0.75rem;
      background: rgba(30, 41, 59, 0.85);
      padding: 1rem;
      border-radius: 14px;
      border: 1px solid var(--border);
      margin-bottom: 1.25rem;
    }
    @media (max-width: 640px) {
      .controls { grid-template-columns: 1fr; }
    }
    input, select, button {
      background: #0f172a;
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 0.65rem 0.9rem;
      font-size: 0.95rem;
    }
    button {
      cursor: pointer;
      background: linear-gradient(135deg, #0284c7, #7e22ce);
      border: none;
      font-weight: 600;
    }
    button:hover { opacity: 0.92; }
    button.secondary {
      background: #0f172a;
      border: 1px solid var(--border);
      padding: 0.45rem 0.75rem;
      font-size: 0.85rem;
    }
    button.secondary:hover {
      border-color: var(--accent);
      color: var(--accent);
    }
    .audio-panel {
      background: #1e293b;
      border: 1px solid rgba(56, 189, 248, 0.35);
      border-radius: 14px;
      padding: 1rem 1.2rem;
      margin-bottom: 1.25rem;
      display: none;
    }
    .audio-panel.active { display: block; }
    .audio-status {
      margin-top: 0.5rem;
      font-size: 0.88rem;
      color: var(--warn);
    }
    .status-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      color: var(--muted);
      font-size: 0.9rem;
      margin-bottom: 1rem;
      gap: 1rem;
      flex-wrap: wrap;
    }
    .random-card {
      background: linear-gradient(135deg, rgba(56, 189, 248, 0.14), rgba(168, 85, 247, 0.14));
      border: 1px solid rgba(56, 189, 248, 0.35);
      border-radius: 14px;
      padding: 1rem 1.25rem;
      margin-bottom: 1.5rem;
      display: none;
    }
    .random-card.active { display: block; }
    .track-list {
      display: grid;
      gap: 0.65rem;
    }
    .track-item {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 0.9rem 1.1rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 1rem;
      transition: background 0.15s ease;
    }
    .track-item:hover { background: var(--card-hover); }
    @media (max-width: 720px) {
      .track-item { flex-direction: column; align-items: flex-start; }
    }
    .track-title { font-weight: 700; font-size: 1.02rem; }
    .track-en { color: var(--muted); font-style: italic; font-weight: 400; font-size: 0.92rem; }
    .track-meta { color: var(--muted); font-size: 0.88rem; margin-top: 0.2rem; }
    .links { display: flex; gap: 0.4rem; flex-shrink: 0; flex-wrap: wrap; align-items: center; }
    .links a {
      text-decoration: none;
      font-size: 0.82rem;
      font-weight: 600;
      padding: 0.42rem 0.65rem;
      border-radius: 8px;
      border: 1px solid var(--border);
      color: var(--text);
      background: rgba(15, 23, 42, 0.75);
    }
    .links a:hover { border-color: var(--accent); color: var(--accent); }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>Royaumes des Mélodies</h1>
      <p class="subtitle">Catalogue intégré de 151 titres — Lecteur audio natif &amp; recherches ciblées sans Spotify</p>
    </header>

    <div class="controls">
      <input type="search" id="searchInput" placeholder="Rechercher un titre FR/EN, un film ou une année..." />
      <select id="typeFilter">
        <option value="ALL">Tous les types</option>
        <option value="Chanson">Chansons</option>
        <option value="Instrumental">Instrumentaux</option>
      </select>
      <button type="button" id="randomBtn">Tirage aléatoire</button>
    </div>

    <div id="audioPanel" class="audio-panel">
      <div id="audioLabel" style="font-weight:700; margin-bottom:0.5rem;"></div>
      <audio id="audioPlayer" controls preload="auto" style="width:100%;"></audio>
      <div id="audioStatus" class="audio-status"></div>
      <div id="audioLinks" class="links" style="margin-top:0.65rem;"></div>
    </div>

    <div id="randomCard" class="random-card"></div>

    <div class="status-bar">
      <span id="countLabel">Chargement...</span>
      <span>Astuce : renseigne <code>audio_url</code> dans le JSON pour une lecture 100% locale/directe</span>
    </div>

    <div id="tracksList" class="track-list"></div>
  </div>

  <script>
    const DISNEY_TRACKS = JSON.parse(
      document.getElementById("disney-tracks-data").textContent.trim()
    );

    const searchInput = document.getElementById("searchInput");
    const typeFilter = document.getElementById("typeFilter");
    const randomBtn = document.getElementById("randomBtn");
    const randomCard = document.getElementById("randomCard");
    const countLabel = document.getElementById("countLabel");
    const tracksList = document.getElementById("tracksList");

    const audioPanel = document.getElementById("audioPanel");
    const audioLabel = document.getElementById("audioLabel");
    const audioPlayer = document.getElementById("audioPlayer");
    const audioStatus = document.getElementById("audioStatus");
    const audioLinks = document.getElementById("audioLinks");

    function renderLinksHtml(track) {
      return `
        <button type="button" class="secondary" onclick="selectTrackById(${track.id})">Écouter / Options</button>
        <a href="${track.lien_youtube_fr}" target="_blank" rel="noopener noreferrer">YT FR</a>
        <a href="${track.lien_youtube_en}" target="_blank" rel="noopener noreferrer">YT EN</a>
        <a href="${track.lien_deezer}" target="_blank" rel="noopener noreferrer">Deezer</a>
        <a href="${track.lien_apple}" target="_blank" rel="noopener noreferrer">Apple</a>
      `;
    }

    function selectTrackById(id) {
      const track = DISNEY_TRACKS.find((t) => t.id === id);
      if (!track) return;

      audioPanel.classList.add("active");
      audioLabel.textContent = `#${track.id} — ${track.titre_fr} (${track.titre_en}) • ${track.film} (${track.annee})`;
      audioLinks.innerHTML = renderLinksHtml(track);

      if (!track.audio_url || !track.audio_url.trim()) {
        audioPlayer.removeAttribute("src");
        audioPlayer.load();
        audioStatus.textContent = "Pas de flux audio direct (audio_url vide) : utilise YT FR, YT EN, Deezer ou Apple ci-dessus.";
        return;
      }

      audioStatus.textContent = "Chargement du flux audio...";
      audioPlayer.src = track.audio_url.trim();
      audioPlayer.play()
        .then(() => {
          audioStatus.textContent = "Lecture audio en cours.";
        })
        .catch(() => {
          audioStatus.textContent = "Lecture bloquée ou source indisponible : clique sur Lecture ou utilise les liens ci-dessus.";
        });
    }

    window.selectTrackById = selectTrackById;

    audioPlayer.addEventListener("error", () => {
      if (audioPlayer.getAttribute("src")) {
        audioStatus.textContent = "Impossible de lire ce fichier audio (introuvable ou format non supporté) : utilise les liens ci-dessus.";
      }
    });

    function getFilteredTracks() {
      const q = searchInput.value.trim().toLowerCase();
      const t = typeFilter.value;
      return DISNEY_TRACKS.filter((item) => {
        const okType = t === "ALL" || item.type === t;
        const okQuery =
          !q ||
          item.titre_fr.toLowerCase().includes(q) ||
          item.titre_en.toLowerCase().includes(q) ||
          item.film.toLowerCase().includes(q) ||
          String(item.annee).includes(q);
        return okType && okQuery;
      });
    }

    function renderList() {
      const list = getFilteredTracks();
      countLabel.textContent = `${list.length} titre(s) affiché(s) sur ${DISNEY_TRACKS.length}`;

      tracksList.innerHTML = list
        .map(
          (track) => `
          <article class="track-item">
            <div>
              <div class="track-title">
                #${track.id} — ${track.titre_fr}
                <span class="track-en">(${track.titre_en})</span>
              </div>
              <div class="track-meta">${track.film} (${track.annee}) • ${track.type}</div>
            </div>
            <div class="links">
              ${renderLinksHtml(track)}
            </div>
          </article>
        `
        )
        .join("");
    }

    function pickRandomTrack() {
      const pool = getFilteredTracks();
      if (!pool.length) {
        randomCard.classList.remove("active");
        return;
      }
      const chosen = pool[Math.floor(Math.random() * pool.length)];
      randomCard.classList.add("active");
      randomCard.innerHTML = `
        <div style="display:flex; justify-content:space-between; align-items:center; gap:1rem; flex-wrap:wrap;">
          <div>
            <div style="font-size:0.8rem; text-transform:uppercase; letter-spacing:0.06em; color:#38bdf8; font-weight:700;">
              Morceau tiré au sort
            </div>
            <div style="font-size:1.15rem; font-weight:700; margin-top:0.15rem;">
              ${chosen.titre_fr} <span class="track-en">(${chosen.titre_en})</span>
            </div>
            <div class="track-meta">${chosen.film} (${chosen.annee}) • ${chosen.type}</div>
          </div>
          <div class="links">
            ${renderLinksHtml(chosen)}
          </div>
        </div>
      `;
    }

    searchInput.addEventListener("input", renderList);
    typeFilter.addEventListener("change", renderList);
    randomBtn.addEventListener("click", pickRandomTrack);

    renderList();
  </script>
